<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060913">
  <title>Sign in · CST Semester Study Matrix</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#65718a; --line:#e4e9f1; --accent:#5b5ce2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:#f4f7fb; color:var(--ink); font:15px/1.5 Inter,system-ui,sans-serif; }
    main { width:min(100%,420px); background:#fff; border:1px solid var(--line);
      border-radius:24px; padding:30px; box-shadow:0 18px 55px #1e2d5012; }
    .mark { display:inline-block; padding:6px 10px; border-radius:999px; background:#eef0ff;
      color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:16px 0 6px; font-size:28px; letter-spacing:-.03em; }
    p { color:var(--muted); margin:0 0 22px; }
    label { display:block; font-weight:650; margin-bottom:8px; }
    input { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    input:focus { outline:3px solid #c7d2fe; border-color:var(--accent); }
    button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px;
      background:var(--accent); color:#fff; font:inherit; font-weight:750; cursor:pointer; }
    .error { padding:10px 12px; margin-bottom:16px; border-radius:10px; background:#fff0f0; color:#9f2424; }
    .warning { font-size:13px; margin-top:16px; }
  </style>
</head>
<body>
  <main>
    <span class="mark">Personal workspace</span>
    <h1>CST Semester Study Matrix</h1>
    <p>Sign in to access your study progress, flashcards, revisions and exams.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login', next=request.args.get('next', '/')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Study app password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
    {% if not configured %}
      <p class="warning">Server setup required: configure STUDY_APP_PASSWORD before signing in.</p>
    {% endif %}
  </main>
</body>
</html>
