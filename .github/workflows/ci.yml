name: TaskFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit Node.js dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Check formatting
        run: npm --prefix frontend run format:check

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build Next.js application
        run: npm --prefix frontend run build

      - name: Run container API smoke tests
        env:
          APP_ENV: development
          STUDY_APP_PASSWORD: ci6Pwd
          SECRET_KEY: ci-test-signing-secret-for-release-smoke-tests
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          docker compose up --build -d api db nginx
          bash scripts/api-smoke-test.sh http://127.0.0.1:8080
          docker compose down

  build:
    name: Build and Scan Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t taskflow:${{ github.sha }} .

      - name: Verify Docker image
        run: docker image inspect taskflow:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: taskflow:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
