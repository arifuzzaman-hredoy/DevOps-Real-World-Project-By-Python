name: Publish TaskFlow image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Test, Build, Scan and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit Node.js dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build Next.js application
        run: npm --prefix frontend run build

      - name: Run container API smoke tests
        env:
          APP_ENV: development
          STUDY_APP_PASSWORD: ci6Pwd
          SECRET_KEY: ci-test-signing-secret-for-release-smoke-tests
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          docker compose up --build -d api db nginx
          bash scripts/api-smoke-test.sh http://127.0.0.1:8080

      - name: Diagnose failed container smoke tests
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100 api db nginx

      - name: Stop container smoke-test stack
        if: always()
        run: docker compose down

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend before publishing
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --load \
            --tag "taskflow:${IMAGE_SHA}" \
            .

          docker image inspect "taskflow:${IMAGE_SHA}"

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: taskflow:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arifuzzaman-hredoy/devops-real-world-project-by-python
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image
        env:
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            echo "Tagging scanned image: $tag"
            docker tag "taskflow:${IMAGE_SHA}" "$tag"

            echo "Publishing: $tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
