name: Publish TaskFlow image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: frontend
            port: "3000"
          - service: backend
            port: "3001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install and typecheck
        run: |
          npm ci --prefix ${{ matrix.service }}
          npm --prefix ${{ matrix.service }} run typecheck

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile
          build-args: |
            APP_DIR=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
            BACKEND_URL=http://backend:3001
          push: true
          tags: |
            ghcr.io/arifuzzaman-hredoy/taskflow-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/arifuzzaman-hredoy/taskflow-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
