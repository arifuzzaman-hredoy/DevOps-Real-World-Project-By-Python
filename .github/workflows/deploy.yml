name: Deploy TaskFlow to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag, e.g. latest or sha-<commit-sha>"
        required: true
        type: string
        default: "latest"

  workflow_run:
    workflows:
      - Publish TaskFlow image to GHCR
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: taskflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}

    steps:
      - name: Validate image tag
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag"
            exit 1
          fi

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/taskflow_deploy
          chmod 600 ~/.ssh/taskflow_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy selected image directly via Compose
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"

          # এখানে ওল্ড ভাঙা স্ক্রিপ্ট বাইপাস করে সরাসরি ডকার কম্পোজ রান করা হচ্ছে
          ssh \
            -i ~/.ssh/taskflow_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "ubuntu@$EC2_HOST" \
            "cd ~/taskflow-consolidation && sudo docker compose pull && sudo docker compose up -d"

      - name: Verify Live Container Status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          sleep 5
          ssh \
            -i ~/.ssh/taskflow_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "ubuntu@$EC2_HOST" \
            "sudo docker compose ps"
