name: Deploy TaskFlow to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable GHCR image tag: sha-<40-character commit SHA>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: taskflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate image tag
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Image tag must be an immutable sha-<40-character commit SHA> tag"
            exit 1
          fi

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/taskflow_deploy
          chmod 600 ~/.ssh/taskflow_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          test -s ~/.ssh/taskflow_deploy
          test -s ~/.ssh/known_hosts

      - name: Verify production Study Matrix secrets before deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"

          ssh \
            -i ~/.ssh/taskflow_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "ubuntu@$EC2_HOST" \
            "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test -s /opt/taskflow/.env
          grep -Eq '^SECRET_KEY=.{32,}$' /opt/taskflow/.env
          ! grep -Eq '^SECRET_KEY=(replace-with|dev-only-change-me)' /opt/taskflow/.env
          grep -Eq '^STUDY_APP_PASSWORD=.{16,}$' /opt/taskflow/.env
          ! grep -Eq '^STUDY_APP_PASSWORD=(replace-with|local-dev|change-this)' /opt/taskflow/.env
          grep -Eq '^POSTGRES_DB=.+$' /opt/taskflow/.env
          grep -Eq '^POSTGRES_USER=.+$' /opt/taskflow/.env
          grep -Eq '^POSTGRES_PASSWORD=.+$' /opt/taskflow/.env
          grep -Eq 'SECRET_KEY: \$\{SECRET_KEY:\?' /opt/taskflow/compose.yaml
          grep -Eq 'STUDY_APP_PASSWORD: \$\{STUDY_APP_PASSWORD:\?' /opt/taskflow/compose.yaml
          grep -A2 -Fq 'location = /api/metrics {' /opt/taskflow/nginx.conf
          grep -A2 -F 'location = /api/metrics {' /opt/taskflow/nginx.conf | grep -Fq 'return 404;'
          grep -A2 -F 'location ^~ /api/metrics/ {' /opt/taskflow/nginx.conf | grep -Fq 'return 404;'
          sudo docker exec taskflow-nginx-1 nginx -t
          REMOTE

      - name: Verify production metrics endpoint is private
        run: |
          set -euo pipefail

          metrics_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 10 \
              --silent \
              --show-error \
              -o /dev/null \
              -w '%{http_code}' \
              https://taskflow.oxytumzone.com/api/metrics
          )"

          if [[ "$metrics_status" != "404" ]]; then
            echo "Production metrics endpoint must return 404 before deployment"
            exit 1
          fi

      - name: Deploy selected image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST"

          ssh \
            -i ~/.ssh/taskflow_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "ubuntu@$EC2_HOST" \
            "sudo /usr/local/bin/taskflow-deploy '$IMAGE_TAG'"

      - name: Verify public HTTPS health
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl \
              --connect-timeout 5 \
              --max-time 10 \
              --fail \
              --silent \
              --show-error \
              https://taskflow.oxytumzone.com/api/ready \
              -o /tmp/taskflow-health.json; then

              cat /tmp/taskflow-health.json

              if grep -q '"status":"ready"' /tmp/taskflow-health.json &&
                 grep -q '"database":"ok"' /tmp/taskflow-health.json; then
                echo "Deployment health check passed for tag: $IMAGE_TAG"
                exit 0
              fi
            fi

            sleep 5
          done

          echo "Deployment health check failed"
          exit 1
