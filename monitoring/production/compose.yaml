services:
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    networks:
      - monitoring
      - taskflow_backend
    healthcheck:
      test:
        - CMD
        - promtool
        - check
        - ready
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Missing Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_DOMAIN: grafana.oxytumzone.com
      GF_SERVER_ROOT_URL: https://grafana.oxytumzone.com
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    mem_limit: 256m
    networks:
      - monitoring
      - taskflow_backend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -ec
        - "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+|run/.+)$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    mem_limit: 64m
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  taskflow_backend:
    external: true

volumes:
  prometheus-data:
  grafana-data:
