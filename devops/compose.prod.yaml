# EC2 production stack: images only, NO build on the server.
# Run from the repo checkout (e.g. /opt/taskflow):
#   docker compose --env-file .env -f devops/compose.prod.yaml pull
#   docker compose --env-file .env -f devops/compose.prod.yaml up -d
name: taskflow

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: [*restart, *logging]
    image: ${TASKFLOW_FRONTEND_IMAGE:?set TASKFLOW_FRONTEND_IMAGE}
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
    networks: [app-net]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 4s
      start_period: 30s
      retries: 10

  backend:
    <<: [*restart, *logging]
    image: ${TASKFLOW_BACKEND_IMAGE:?set TASKFLOW_BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      APP_ENV: production
      # APP_ENV=production hole SECRET_KEY minimum 32 bytes lagbe, na hole /api/ready 503 dey
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ chars) in .env}
      STUDY_APP_PASSWORD: ${STUDY_APP_PASSWORD:?set STUDY_APP_PASSWORD in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 4s
      start_period: 30s
      retries: 10

  db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    <<: [*restart, *logging]
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [app-net]

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v3.7.3
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # node-exporter host e cholle (host.docker.internal:9100) Linux e eta lagbe
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [backend]
    networks: [app-net]

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:12.2.1
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [app-net]

volumes:
  taskflow-db-data:
  grafana-data:

networks:
  app-net:
