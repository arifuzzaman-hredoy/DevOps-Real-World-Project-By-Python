global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cst-matrix-backend
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - backend:3001

  # node-exporter container host network e chole (port 9101)
  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9101
