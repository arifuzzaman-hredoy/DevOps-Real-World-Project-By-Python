groups:
  - name: taskflow
    rules:
      - alert: BackendDown
        expr: up{job="cst-matrix-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "TaskFlow backend is down"

      - alert: HighErrorRate
        expr: (sum(rate(taskflow_http_requests_total{status=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate(taskflow_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(taskflow_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "P95 latency is above 1 second"

  - name: host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Host metrics are not being collected"

      - alert: HostHighCPU
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CPU usage above 85% for 10 minutes"

      - alert: HostHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Memory usage above 90%"

      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{mountpoint="/",fstype=~"ext4|xfs|btrfs"}) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Root disk is more than 85% full"
